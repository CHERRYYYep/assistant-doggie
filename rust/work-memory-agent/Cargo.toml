[package]
name = "work-memory-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "LLM adapters and controlled agent harness for Personal Work Memory Agent"

[dependencies]
thiserror.workspace = true
async-openai = { version = "0.41.1", default-features = false, features = ["response-types", "chat-completion-types"] }
serde = "1"
serde_json = "1"
ureq = { version = "3.3.0", features = ["json", "socks-proxy"] }
url = "2"
work-memory-contracts = { path = "../work-memory-contracts" }
