[package]
name = "work-memory-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Canonical Rust application runtime for the Personal Work Memory Agent"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
work-memory-agent = { path = "../work-memory-agent" }
work-memory-contracts = { path = "../work-memory-contracts" }
work-memory-core = { path = "../work-memory-core" }
work-memory-service = { path = "../work-memory-service" }
work-memory-store = { path = "../work-memory-store" }

[dev-dependencies]
tempfile.workspace = true
