[package]
name = "work-memory-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "SQLite compatibility and migration safety for Personal Work Memory Agent"

[[bin]]
name = "work-memory-store-admin"
path = "src/bin/store_admin.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
rusqlite = { version = "0.34", features = ["backup", "bundled"] }
serde = "1"
serde_json = "1"
unicode-casefold = "0.2"
uuid = { version = "1", features = ["v4"] }
work-memory-contracts = { path = "../work-memory-contracts" }
work-memory-core = { path = "../work-memory-core" }
