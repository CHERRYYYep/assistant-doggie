[workspace]
members = [
    "crates/doggie-domain",
    "crates/doggie-protocol",
    "crates/doggie-storage-sqlite",
    "crates/doggie-application",
    "crates/doggie-llm",
    "crates/doggie-agent-runtime",
    "crates/doggie-engine",
    "apps/doggie-local-web",
]
resolver = "3"

[workspace.dependencies]
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
httpmock = { version = "=0.8.2", default-features = false }
uuid = { version = "1", features = ["v4"] }
