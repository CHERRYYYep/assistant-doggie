[workspace]
members = [
    "rust/work-memory-core",
    "rust/work-memory-contracts",
    "rust/work-memory-store",
    "rust/work-memory-service",
    "rust/work-memory-agent",
    "rust/work-memory-runtime",
    "rust/work-memory-server",
]
resolver = "3"

[workspace.dependencies]
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
httpmock = { version = "=0.8.2", default-features = false }
uuid = { version = "1", features = ["v4"] }
