[package]
name = "doggie-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Stable execution facade for the Doggie local-first memory engine"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
doggie-llm = { path = "../doggie-llm" }
doggie-protocol = { path = "../doggie-protocol" }
doggie-domain = { path = "../doggie-domain" }
doggie-application = { path = "../doggie-application" }
doggie-storage-sqlite = { path = "../doggie-storage-sqlite" }

[dev-dependencies]
tempfile.workspace = true
