[package]
name = "doggie-llm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "LLM endpoint adapters, HTTP transport, and structured-output parsing for Doggie"

[dependencies]
thiserror.workspace = true
async-openai = { version = "0.41.1", default-features = false, features = ["response-types", "chat-completion-types"] }
serde = "1"
serde_json = "1"
ureq = { version = "3.3.0", features = ["json", "socks-proxy"] }
url = "2"
doggie-protocol = { path = "../doggie-protocol" }

[dev-dependencies]
httpmock.workspace = true
